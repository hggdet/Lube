name: Simulator Screenshots

on:
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen openssl@3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare checksum-pinned signing dependencies
        run: python3 scripts/prepare_dependencies.py
      - name: Generate project
        run: xcodegen generate
      - name: Create simulator
        id: simdev
        run: |
          RT=$(xcrun simctl list runtimes available | grep -E "iOS [0-9]+" | tail -1 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+")
          echo "Runtime: $RT"
          DT=$(xcrun simctl list devicetypes | grep -E "iPhone (1[6-9]|[2-9][0-9]) Pro " | head -1 | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+")
          if [ -z "$DT" ]; then DT=$(xcrun simctl list devicetypes | grep -E "iPhone" | head -1 | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+"); fi
          echo "DeviceType: $DT"
          UDID=$(xcrun simctl create LubeSim "$DT" "$RT")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for Simulator
        run: |
          xcodebuild build -project Lube.xcodeproj -scheme LubeUISim -destination 'platform=iOS Simulator,id=${{ steps.simdev.outputs.udid }}' -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - name: Install idb
        continue-on-error: true
        run: |
          brew tap facebook/fb || true
          brew trust facebook/fb || true
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install idb-companion || true
          pip3 install --break-system-packages fb-idb || pipx install fb-idb
          which idb || true
          which idb_companion || true
          idb list-targets || true
      - name: Install app
        run: |
          UDID=${{ steps.simdev.outputs.udid }}
          APP=$(find build/DD/Build/Products -name "LubeUISim.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
      - name: Drive the app
        continue-on-error: true
        run: |
          UDID=${{ steps.simdev.outputs.udid }}
          mkdir -p shots
          idb list-targets > shots/idb-status.txt 2>&1 || true
          shot() { xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          tap() { idb ui tap --udid "$UDID" "$1" "$2" || true; sleep 2; }
          swipeup() { idb ui swipe --udid "$UDID" --duration 0.6 201 620 201 300 || true; sleep 1; }
          xcrun simctl launch "$UDID" com.hggdet.lube.uisim
          sleep 6
          shot 01-sign
          swipeup
          shot 02-sign-mid
          swipeup
          shot 03-sign-bottom
          tap 201 803
          shot 04-sources
          swipeup
          shot 05-sources-scrolled
          tap 287 803
          shot 06-library
          swipeup
          shot 07-library-scrolled
          tap 95 803
          tap 337 378
          sleep 2
          shot 08-cert-picker
          idb ui button --udid "$UDID" HOME || true
          sleep 1
          xcrun simctl launch "$UDID" com.hggdet.lube.uisim || true
          sleep 4
          xcrun simctl ui "$UDID" appearance dark
          sleep 1
          shot 09-sign-dark
          tap 201 803
          shot 10-sources-dark
          tap 287 803
          shot 11-library-dark
          ls ~/Library/Logs/DiagnosticReports/ | grep -i lube > shots/crashes.txt || echo "no crash reports" > shots/crashes.txt
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Screenshots
          path: shots/
          if-no-files-found: warn
