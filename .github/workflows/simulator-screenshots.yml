name: Simulator Screenshots

on:
  workflow_dispatch:

jobs:
  sim:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Create simulator
        id: simdev
        run: |
          RT=$(xcrun simctl list runtimes available | grep -E "iOS [0-9]+" | tail -1 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+")
          echo "Runtime: $RT"
          DT=$(xcrun simctl list devicetypes | grep -E "iPhone (1[6-9]|[2-9][0-9]) Pro " | head -1 | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+")
          if [ -z "$DT" ]; then DT=$(xcrun simctl list devicetypes | grep -E "iPhone" | head -1 | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+"); fi
          echo "DeviceType: $DT"
          UDID=$(xcrun simctl create LubeSim "$DT" "$RT")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for Simulator
        run: |
          xcodebuild build -project ForgeSignMobile.xcodeproj -target ForgeSignUISim -destination 'platform=iOS Simulator,id=${{ steps.simdev.outputs.udid }}' -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - name: Install, launch and screenshot
        run: |
          UDID=${{ steps.simdev.outputs.udid }}
          APP=$(find build/DD/Build/Products -name "ForgeSignUISim.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$UDID" "$BID"
          sleep 8
          xcrun simctl io "$UDID" screenshot sim-sign.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Screenshots
          path: sim-sign.png
