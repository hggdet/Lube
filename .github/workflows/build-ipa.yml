name: Build Official IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen openssl@3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare checksum-pinned signing dependencies
        run: python3 scripts/prepare_dependencies.py

      - name: Generate project
        run: xcodegen generate

      - name: Build device Release target
        run: |
          xcodebuild build \
            -project ForgeSignMobile.xcodeproj \
            -scheme ForgeSignMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          python3 scripts/package_ipa.py pack \
            build/ci-derived/Build/Products/Release-iphoneos/ForgeSign.app \
            build/ForgeSign-2.8.3.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeSign-Official-IPA
          path: build/ForgeSign-2.8.3.ipa
